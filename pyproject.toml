[project]
name = "faers-db"
version = "0.2.0"
description = "Local-first FAERS warehouse using DuckDB + Parquet"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.3",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "orjson>=3.11.7",
    "polars>=1.39.0",
    "pyarrow>=23.0.1",
    "pydantic-settings>=2.13.1",
    "python-dateutil>=2.9.0.post0",
    "rich>=14.3.3",
    "typer>=0.24.1",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
